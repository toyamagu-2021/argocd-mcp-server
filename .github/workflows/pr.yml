name: Pull Request CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download dependencies
        run: make deps

      - name: Install linting tools
        run: make lint-install

      - name: Run full linting
        run: make lint

  test:
    runs-on: ubuntu-latest

    steps:
      # No harden-runner on this job. Its egress monitor breaks DNS for pods
      # in the Kind cluster, so Argo CD cannot fetch Git repositories.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download dependencies
        run: make deps

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: "argocd-mcp-server"
          config: kind-config.yaml

      - name: Install ArgoCD
        run: make install-argocd

      - name: Install ArgoCD CLI
        run: |
          VERSION=${TAG} # Select desired TAG from https://github.com/argoproj/argo-cd/releases
          base="https://github.com/argoproj/argo-cd/releases/download/${VERSION}"
          curl -fsSL -o argocd-linux-amd64 "${base}/argocd-linux-amd64"
          curl -fsSL -o cli_checksums.txt "${base}/cli_checksums.txt"
          grep ' argocd-linux-amd64$' cli_checksums.txt | sha256sum -c -
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64 cli_checksums.txt
        env:
          TAG: v3.6.2

      - name: Generate ArgoCD credentials
        run: |
          make generate-env generate-token
          
      - name: Run tests with coverage
        run: |
          source .env
          # Same packages and flags as `make test-cover` (`go test -cover ./...`).
          # argocd_e2e is split out only to add -v, so subtest names show up in the log.
          # The set of tests is unchanged.
          mapfile -t pkgs < <(go list ./... | grep -v '/test/argocd_e2e$')
          test "${#pkgs[@]}" -gt 0
          ARGOCD_INSECURE=true ARGOCD_SERVER=${ARGOCD_SERVER} ARGOCD_AUTH_TOKEN=${ARGOCD_AUTH_TOKEN} \
            go test -cover "${pkgs[@]}"
          ARGOCD_INSECURE=true ARGOCD_SERVER=${ARGOCD_SERVER} ARGOCD_AUTH_TOKEN=${ARGOCD_AUTH_TOKEN} \
            go test -cover -v ./test/argocd_e2e

      # Design D5: exercise the gRPC-Web transport end to end at least once.
      - name: Run gRPC-Web E2E tests
        run: |
          source .env
          ARGOCD_INSECURE=true ARGOCD_SERVER=${ARGOCD_SERVER} ARGOCD_AUTH_TOKEN=${ARGOCD_AUTH_TOKEN} \
            ARGOCD_MCP_E2E_GRPC_WEB=1 \
            go test -count=1 -v -timeout 20m -run 'TestRealArgoCD_Suite/gRPC-Web/IndependentTests' ./test/argocd_e2e

      - name: Build binary
        run: make build
