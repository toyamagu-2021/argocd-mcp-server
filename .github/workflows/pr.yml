name: Pull Request CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: "go.mod"

      # - name: Cache Go modules
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.cache/go-build
      #       ~/go/pkg/mod
      #     key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      #     restore-keys: |
      #       ${{ runner.os }}-go-

      - name: Download dependencies
        run: make deps

      - name: Install linting tools
        run: make lint-install

      - name: Run full linting
        run: make lint

  test:
    runs-on: ubuntu-latest

    steps:
      # No harden-runner on this job. Its egress monitor breaks DNS for pods
      # in the Kind cluster, so Argo CD cannot fetch Git repositories.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: "go.mod"

      # - name: Cache Go modules
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.cache/go-build
      #       ~/go/pkg/mod
      #     key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      #     restore-keys: |
      #       ${{ runner.os }}-go-

      - name: Download dependencies
        run: make deps

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: "argocd-mcp-server"
          config: kind-config.yaml

      - name: Install ArgoCD
        run: make install-argocd

      - name: Install ArgoCD CLI
        run: |
          VERSION=${TAG} # Select desired TAG from https://github.com/argoproj/argo-cd/releases
          base="https://github.com/argoproj/argo-cd/releases/download/${VERSION}"
          curl -fsSL -o argocd-linux-amd64 "${base}/argocd-linux-amd64"
          curl -fsSL -o cli_checksums.txt "${base}/cli_checksums.txt"
          grep ' argocd-linux-amd64$' cli_checksums.txt | sha256sum -c -
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64 cli_checksums.txt
        env:
          TAG: v3.6.2

      - name: Generate ArgoCD credentials
        run: |
          make generate-env generate-token
          
      - name: Run tests
        run: |
          source .env
          ARGOCD_INSECURE=true ARGOCD_SERVER=${ARGOCD_SERVER} ARGOCD_AUTH_TOKEN=${ARGOCD_AUTH_TOKEN} make test

      - name: Run tests with coverage
        run: make test-cover

      - name: Build binary
        run: make build
