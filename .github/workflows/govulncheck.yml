name: govulncheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      - name: Report reachable vulnerabilities
        run: |
          set +e
          govulncheck ./... | tee govulncheck.txt
          code=$?
          # Exit 3 means reachable vulnerabilities were found. Two Kubernetes
          # findings have no published fix, so the job records them and does
          # not fail the build. Any other exit code is a scan failure.
          if [ "$code" -eq 3 ]; then
            echo "govulncheck reported reachable vulnerabilities. See govulncheck.txt."
            exit 0
          fi
          exit "$code"
